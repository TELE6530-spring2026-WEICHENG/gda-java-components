# Mosquitto 1.6 configuration

# Standard MQTT over TCP
listener 1883
allow_anonymous true

# MQTT over WebSocket (for browser clients)
listener 9001
protocol websockets
allow_anonymous true

# To enable authentication, change the lines above to:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
# Then set enableAuth=True in PiotConfig.props [Mqtt.GatewayService]

# TLS MQTT
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
allow_anonymous true
